(miss?"<div class='note np'>"+miss+" driver(s) have no pay entered for this period. Type pay below (or on the Drivers tab) to calculate productivity. Pay stays saved in this browser.</div>":"")+

"<p>"+LEG+"</p>"+tbl("tPay",[{k:"drv",h:"Driver",l:1,f:function(v){return lk(v)+dn(v)+"</span>"}},{k:"dc",h:"Days",f:N},{k:"tbN",h:"TB Calls",f:N},{k:"tb",h:"Towbook $",f:$m},{k:"aN",h:"AAA Calls",f:N},{k:"aa",h:"AAA $",f:$m},{k:"n",h:"Total Calls",f:N},{k:"rev",h:"Total Revenue",f:function(v){return "<b>"+$m(v)+"</b>"}},{k:"avg",h:"Avg $/Call",f:$m},{k:"pay",h:"Pay",f:function(v,r){return "<input class='pay' data-pay='"+E(r.drv)+"' value='"+(v||"")+"' placeholder='enter'>"}},{k:"prod",h:"Productivity %",f:function(v){return "<span class='"+pc(v)+"'>"+P(v)+"</span>"},x:function(r){return isFinite(r.prod)?r.prod:""}}],D,{sort:{k:"rev",dir:-1},h:3000,foot:{drv:"Total",tbN:N(T.tbN),tb:$m(T.tb),aN:N(T.aN),aa:$m(T.aa),n:N(T.n),rev:$m(T.rev),avg:$m(T.n?T.rev/T.n:0),pay:T.pay?$m(T.pay):"",prod:T.pay&&T.rev?P(T.pay/T.rev):""}})+

function payImport(){var t=prompt("Paste pay lines as Name then a tab or comma then Amount, one per line (copied from Excel works):");if(!t)return;var k=pkey(),n=0;PAY[k]=PAY[k]||{};t.split(/\r?\n/).forEach(function(l){var p=l.split(/\t|,(?=[^,]*$)/);if(p.length>=2){var v=parseFloat(p[1].replace(/[$,\s]/g,""));if(!isNaN(v)){PAY[k][p[0].trim()]=v;n++}}});savePay();render();alert(n+" pay amounts loaded for "+pl())}
