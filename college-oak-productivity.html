function render(){document.getElementById("pre").innerHTML=R.presets.map(function(p,i){return "<button data-preset='"+i+"' class='"+(p[1]===S.from&&p[2]===S.to?"on":"")+"'>"+p[0]+"</button>"}).join("");
function op(v){return DAYS.map(function(d){return "<option value='"+d+"'"+(d===v?" selected":"")+">"+dw(d)+" "+dl(d)+"</option>"}).join("")}document.getElementById("fs").innerHTML=op(S.from);document.getElementById("ts").innerHTML=op(S.to);
document.getElementById("hs").textContent=pl()+" | "+R.source;document.getElementById("nav").innerHTML=TABS.map(function(t){return "<a class='"+(S.tab===t[0]?"on":"")+"' data-tab='"+t[0]+"'>"+t[1]+"</a>"}).join("");
var v={overview:vOverview,drivers:vDrivers,driver:vDriver,calls:vCalls,aaa:vAAA,accounts:vAccounts,daily:vDaily,payroll:vPayroll,method:vMethod}[S.tab];document.getElementById("main").innerHTML=v()}
render();
</script></body></html>
